# mock 시나리오 공통값: 시험 시간을 줄이려고 제한 시간을 짧게 둔다
task_manager:
  ros__parameters:
    ready_timeout_sec: 5.0
    nav_timeout_sec: 10.0
    cancel_timeout_sec: 3.0
    clock_watchdog_sec: 3.0
    # cmd_recorder가 /task_manager/state에 붙은 뒤 출발 (새 노드 discovery가 2~3 s 걸릴 때
    # 앞 단계를 놓치지 않게. 시작 지연만으로는 이 지연이 줄지 않음. 상태 토픽 depth 17과 함께 씀)
    wait_state_subscribers: 1
mock_tf:
  ros__parameters:
    x: 1.0          # mock 차체 위치 = 기본 미션 목표 (1.0, 0, 0)
    y: 0.0
    yaw: 0.0
mock_nav_server:
  ros__parameters:
    mode: succeed
    duration_sec: 3.0
